springdoc:
  paths-to-match: /api/**
  default-produces-media-type: application/json
  api-docs:
    path: /api/v3/api-docs
  swagger-ui:
    path: /api/swagger-ui.html
    disable-swagger-default-url: true
    validator-url: ""
spring:
  application:
    name: drivelog-api
server:
  port: 8080
  shutdown: graceful
  forward-headers-strategy: framework
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
drivelog:
  release: ${DRIVELOG_RELEASE:local}
