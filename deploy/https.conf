server {
    listen 443 ssl;
    server_name 35.216.33.209;
    ssl_certificate /etc/letsencrypt/live/35.216.33.209/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/35.216.33.209/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 32k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8080;
    location /api/ {
        proxy_pass $backend;
        proxy_set_header Host 35.216.33.209;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host 35.216.33.209;
        proxy_set_header X-Forwarded-Port 443;
    }
    location = /actuator/health { proxy_pass $backend; }
    location / { return 404; }
}
