name: Deploy production
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: drivelog-production
  cancel-in-progress: false
env:
  PROJECT_ID: drivelog-prod-20261110
  IMAGE: asia-northeast3-docker.pkg.dev/drivelog-prod-20261110/drivelog/backend
  RELEASE_BUCKET: drivelog-releases-1079465774150
jobs:
  deploy:
    name: Build and deploy Spring Boot
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test and package
        run: |
          mvn --batch-mode --no-transfer-progress verify
          python3 -m unittest discover -s deploy -p 'test_*.py' -v
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: projects/1079465774150/locations/global/workloadIdentityPools/github-actions/providers/drivelog-be
          service_account: drivelog-deployer@drivelog-prod-20261110.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Build and push immutable image
        shell: bash
        run: |
          set -euo pipefail
          gcloud auth configure-docker asia-northeast3-docker.pkg.dev --quiet
          docker build --tag "$IMAGE:$GITHUB_SHA" .
          docker push "$IMAGE:$GITHUB_SHA"
          digest=$(gcloud artifacts docker images describe "$IMAGE:$GITHUB_SHA" --format='value(image_summary.digest)')
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          jq -n --arg image "$IMAGE@$digest" --arg sha "$GITHUB_SHA" '{image:$image,sha:$sha}' > /tmp/drivelog-release.json
      - name: Publish release
        run: |
          set -euo pipefail
          gcloud storage cp /tmp/drivelog-release.json "gs://$RELEASE_BUCKET/releases/$GITHUB_SHA.json" --quiet
          gcloud storage cp /tmp/drivelog-release.json "gs://$RELEASE_BUCKET/current.json" --quiet
      - name: Verify deployed commit
        env:
          DEPLOY_URL: https://35.216.33.209
        shell: bash
        run: |
          set -euo pipefail
          check=(curl --proto "=https" --tlsv1.2 --fail --silent --show-error --max-time 8)
          for attempt in $(seq 1 90); do
            if "${check[@]}" "$DEPLOY_URL/api/status" | jq -e --arg sha "$GITHUB_SHA" '.service == "drivelog-api" and .status == "ready" and .release == $sha' >/dev/null; then
              "${check[@]}" "$DEPLOY_URL/api/v3/api-docs" | jq -e '.paths["/api/private-trips/{id}/media/{side}"].put.responses["422"] and .paths["/api/library"].get' >/dev/null
              "${check[@]}" "$DEPLOY_URL/api/swagger-ui/index.html" | grep -q 'swagger-ui-bundle.js'
              "${check[@]}" "$DEPLOY_URL/api/frontend.html" | grep -q 'id="demo"'
              test "$(curl --proto '=https' --silent --max-time 8 --output /dev/null --write-out '%{http_code}' "$DEPLOY_URL/api/library")" = 401
              echo "Deployed $GITHUB_SHA to $DEPLOY_URL"
              exit 0
            fi
            sleep 5
          done
          echo 'Deployment did not pass release verification. Inspect the VM deployment service; failed releases roll back automatically.' >&2
          exit 1
