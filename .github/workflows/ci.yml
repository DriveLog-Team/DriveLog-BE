name: CI
on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]
permissions:
  contents: read
jobs:
  test:
    name: Spring Boot tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install video probe for upload tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
      - run: node --test src/test/js/handoff.test.cjs
      - run: mvn --batch-mode --no-transfer-progress verify
      - run: python3 -m unittest discover -s media -p 'test_*.py' -v
      - name: Check Linux speech and video runtime
        run: |
          docker build -t drivelog-ci .
          docker run --rm --entrypoint /bin/sh drivelog-ci -ec 'whisper-cli --help && ffmpeg -version && python3 /app/media/worker.py --help'
          docker run --rm --entrypoint python3 drivelog-ci -m unittest discover -s /app/media -p 'test_*.py'
          docker run --rm --workdir /app/media --entrypoint python3 drivelog-ci -c 'import numpy as np, road_privacy as r; assert not r.Detector()(np.zeros((r.H,r.W,3),np.uint8))'
      - name: Validate deployment trust boundary
        run: python3 -m unittest discover -s deploy -p 'test_*.py' -v
